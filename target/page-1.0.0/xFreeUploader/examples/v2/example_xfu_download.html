<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="-1" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
<title>download mode</title>
<link rel="stylesheet" href="./images/ex_v2.css" type="text/css" media="screen"/>
<script type="text/javascript" src="../../js/xFreeUploader.js"></script>

<!-- 예제샘플용 공통함수 -->
<script type="text/javascript" src="./xfu_ex_common.js"></script>

<script type="text/javascript">
var wFileDownload;
var strServerType = "php";
var xfuBasePath = "/xFreeUploader";

function init() {
	
	// 서버타입 자동세팅(/index.html로 접근시에만 정상적으로 동작)
	if(top.document.getElementById("serverType")){
	
		strServerType = top.document.getElementById("serverType").value;
	}
	
	//var xfuFilePath = "/xFreeUploader/uploads";
	var xfuFilePath = xfuBasePath + "/uploads";
	
	var origin = document.location.origin;
	
	if(origin) {
	
		xfuBasePath = origin + xfuBasePath;
	} 
	else {
	
		xfuBasePath = document.location.protocol + '//' + document.location.host + xfuBasePath;
	}
	
	// 태그프리 홈페이지 분기처리
	if(xfu_ex_common.checkDomain()){
		
		xfuBasePath = "/xfu_test/v2/xFreeUploader";
		
		//xfuFilePath = "/xfu_test/v2/xFreeUploader/uploads";
		xfuFilePath = xfuBasePath + "/uploads";
		
		if(origin) {
	
			xfuBasePath = origin + xfuBasePath;
		} 
		else {
		
			xfuBasePath = document.location.protocol + '//' + document.location.host + xfuBasePath;
		}		
	}
	
	// 파일다운로드 자바스크립트 방식 호출
	wFileDownload = new xFreeUploader({
		render: "fileDownload",
		basePath : xfuBasePath,
		selectMode: "download",
		filePath : xfuFilePath,
		//serverType: "php",
		serverType: strServerType,
		bodyHeight: 240,
		skinType : -1,
		
		// XFU 로드된 후 발생 이벤트
		onLoad: function (data) {
			//console.log("Load Complete");
			//console.log(data);
			
			// 태그프리 사이트에서는 파일조회를 서버파일추가 방식으로 대체
			if(xfu_ex_common.checkDomain()){
			
				// 서버파일추가
				fileAttachAddTxt();				
			} 
			// 일반적인 테스트는 파일조회 처리
			else {
				
				var dataObj = {
					"filePath": wFileDownload.options.filePath,
					//"filterWord": wFileDownload.options.filterWord
					"filterWord": "*"
				};
				wFileDownload.fileSearch(dataObj);
			}	
		},
		// 파일 조회 submit 발생 전
		onBeforeSearch: function (data) {
			console.log("파일 조회 전");
			console.log(data);
		},
		// 파일 조회 submit 발생 후
		onSearchCallback: function (data) {
			console.log("파일 조회 후");
			console.log(data);
		},
		// 다운로드 실행 후 submit 발생 전
		onBeforeSubmit: function (data) {
			console.log("다운로드 받기전");
			console.log(data);
		},
		// 다운로드 정상 콜백
		onSuccessCallback: function () {
			console.log("파일다운로드 성공");
		},
		// 다운로드 비정상 콜백
		onFailCallback: function (error) {
			console.log("파일다운로드 실패");
			console.log(error);
		},
		// [항목제거] 버튼 클릭 이벤트핸들러
		onDeleteFile: function (data) {
			console.log("항목제거");
			console.log(data);
			
			wFileDownload.emptyFolderDelete("/uploads");
		},
		// [항목전체제거] 버튼 클릭 이벤트핸들러
		onDeleteAllFile: function (data) {
			console.log("항목전체제거");
			console.log(data);
		}
	});
}

// 서버파일조회
function fileSearch() {
	var dataObj = {
		"filePath": wFileDownload.options.filePath,
		//"filterWord": wFileDownload.options.filterWord
		"filterWord": "*"
	};
	wFileDownload.fileSearch(dataObj);
}
// 파일선택다운로드
function fileSelectDownload() {
	wFileDownload.fileSelectDownload();
}
// 파일전체다운로드
function fileAllDownload() {
	wFileDownload.fileAllDownload();
}


</script>
<style type="text/css">
body{
	margin : 0px 2px 0px 0px ;
}
</style>
</head>

<body onload="init()">
	<div class="xFreeUploader-pnl" id="fileDownload"></div>
</body>
</html>
